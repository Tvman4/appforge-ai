name: Build Microsoft Store EXE
on:
  push:
    branches: [ main ]
jobs:
  build-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Package Microsoft Store EXE
        run: |
          npm install
          npx pkg . --output appforge-microsoft-store.exe
      - name: Upload Microsoft Store EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: microsoft-store-exe
          path: appforge-microsoft-store.exe
