name: Build Microsoft Store EXE
on:
  push:
    branches: [ main ]
jobs:
  build-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Ensure package.json has a valid main/bin entry
        run: |
          node -e "
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (!pkg.main) pkg.main = 'index.js';
          if (!pkg.bin) pkg.bin = pkg.main;
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "
      - name: Package Microsoft Store EXE
        run: |
          npm install
          npx pkg . --targets node18-win-x64 --output appforge-microsoft-store.exe
      - name: Upload Microsoft Store EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: microsoft-store-exe
          path: appforge-microsoft-store.exe
