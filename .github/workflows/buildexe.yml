name: Build Standard EXE
on:
  push:
    branches: [ main ]
jobs:
  build-standard-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Package Standard EXE
        run: |
          npm install
          npx pkg . --output appforge-standard.exe
      - name: Upload Standard EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: standard-exe
          path: appforge-standard.exe
