name: Build Unsigned iOS IPA
on:
  push:
    branches: [ main ]
jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Build Valid Unsigned IPA for Sideloading
        run: |
          npm install
          mkdir -p Payload/AppForge.app
          
          # Create an optimized Info.plist compatible with iOS installation signers (like Ksign)
          cat << 'EOF' > Payload/AppForge.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleIdentifier</key>
              <string>com.tvman.appforge</string>
              <key>CFBundleName</key>
              <string>AppForge</string>
              <key>CFBundleDisplayName</key>
              <string>AppForge</string>
              <key>CFBundleExecutable</key>
              <string>AppForge</string>
              <key>CFBundleVersion</key>
              <string>1.0.0</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0.0</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>MinimumOSVersion</key>
              <string>12.0</string>
              <key>UIDeviceFamily</key>
              <array>
                  <integer>1</integer>
                  <integer>2</integer>
              </array>
          </dict>
          </plist>
          EOF

          # Create dummy script execution binary with proper permissions
          echo '#!/bin/sh' > Payload/AppForge.app/AppForge
          echo 'echo "AppForge Running"' >> Payload/AppForge.app/AppForge
          chmod +x Payload/AppForge.app/AppForge

          # Package cleanly into .ipa without extra parent folders
          cd Payload
          zip -r ../appforge-unsigned.ipa .
          cd ..
      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ios-ipa
          path: appforge-unsigned.ipa
