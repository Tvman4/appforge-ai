name: Build Unsigned iOS IPA
on:
  push:
    branches: [ main ]
jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build Unsigned IPA
        run: |
          npm install
          mkdir -p Payload
          if [ -d "public" ]; then cp -r public Payload/AppForge.app; else mkdir -p Payload/AppForge.app; fi
          zip -r appforge-unsigned.ipa Payload
      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ios-ipa
          path: appforge-unsigned.ipa
