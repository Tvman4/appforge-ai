<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AppForge AI</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 750px;
            background: #1e293b;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            height: 88vh;
        }
        h1 {
            font-size: 22px;
            margin-bottom: 5px;
            color: #38bdf8;
        }
        p {
            color: #94a3b8;
            font-size: 13px;
            margin-bottom: 15px;
        }
        .config-box {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }
        input, select {
            width: 100%;
            padding: 10px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            color: #fff;
            font-size: 13px;
            box-sizing: border-box;
        }
        #chatBox {
            flex: 1;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 15px;
            overflow-y: auto;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 14px;
            max-width: 88%;
            line-height: 1.4;
        }
        .user-msg {
            background: #0284c7;
            color: white;
            align-self: flex-end;
        }
        .ai-msg {
            background: #334155;
            color: #f8fafc;
            align-self: flex-start;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 12px;
        }
        .input-area {
            display: flex;
            gap: 10px;
        }
        button {
            background: #0284c7;
            color: white;
            border: none;
            padding: 0 20px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #0ea5e9;
        }
        button:disabled {
            background: #475569;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>AppForge AI</h1>
    <p>Link any target repository, chat with the AI to describe your custom workflow or compilation steps, and deploy automatically.</p>

    <div class="config-box">
        <input type="text" id="repoOwner" placeholder="Target GitHub Owner (e.g., Tvman4)" required>
        <input type="text" id="repoName" placeholder="Target Repo Name (e.g., appforge-ai)" required>
    </div>

    <div id="chatBox">
        <div class="message ai-msg">Hello! Enter the owner and repository above, then tell me what code or custom workflow you want to generate and push.</div>
    </div>

    <form id="chatForm" class="input-area">
        <input type="text" id="userInput" placeholder="Describe what you want to build or automate..." autocomplete="off" required>
        <button type="submit" id="sendBtn">Send</button>
    </form>
</div>

<script>
    const chatBox = document.getElementById('chatBox');
    const chatForm = document.getElementById('chatForm');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const repoOwnerInput = document.getElementById('repoOwner');
    const repoNameInput = document.getElementById('repoName');

    function appendMessage(text, sender) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${sender === 'user' ? 'user-msg' : 'ai-msg'}`;
        msgDiv.textContent = text;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    chatForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const promptText = userInput.value.trim();
        const owner = repoOwnerInput.value.trim();
        const repo = repoNameInput.value.trim();

        if (!promptText || !owner || !repo) {
            alert("Please fill in the target Repository Owner, Repository Name, and your message prompt.");
            return;
        }

        appendMessage(promptText, 'user');
        userInput.value = '';
        userInput.disabled = true;
        sendBtn.disabled = true;

        appendMessage("AI is dynamically writing your custom workflow code and pushing via GitHub App...", 'ai');

        try {
            const response = await fetch('/api/deploy', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    owner,
                    repo,
                    prompt: promptText,
                    filePath: ".github/workflows/build.yml"
                })
            });

            const result = await response.json();
            if (result.success) {
                appendMessage(`Success! Deployed to GitHub:\n${result.url}\n\n--- Generated Code ---\n${result.generatedCode}`, 'ai');
            } else {
                appendMessage(`Error: ${result.error}`, 'ai');
            }
        } catch (err) {
            appendMessage(`Network Error: ${err.message}`, 'ai');
        } finally {
            userInput.disabled = false;
            sendBtn.disabled = false;
            userInput.focus();
        }
    });
</script>

</body>
</html>
